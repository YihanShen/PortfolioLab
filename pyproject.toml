[project]
name = "portfoliolab"
version = "0.1.0"
description = "A personal quantitative research lab for portfolio construction and backtesting."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "PortfolioLab" }]
dependencies = []

[project.optional-dependencies]
research = [
  "duckdb>=1.0",
  "matplotlib>=3.8",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16.0",
]
market-data = [
  "yfinance>=0.2.40",
]
notebook = [
  "ipykernel>=6.0",
  "notebook>=7.0",
]
test = [
  "pytest>=7.0",
]

[project.scripts]
portfoliolab = "portfoliolab.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
